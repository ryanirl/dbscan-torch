[build-system]
# Keep this range in sync with [project].dependencies below. The C++ extension
# is built against whatever torch lands in the isolated build env, so if the
# build-env torch is newer than the runtime torch, the resulting `.so` will
# reference symbols (e.g. libc10 ABI) that don't exist at import time.
requires = ["setuptools>=61", "wheel", "torch>=2.0,<2.8"]
build-backend = "setuptools.build_meta"

[project]
name = "dbscan-torch"
version = "0.1.0"
description = "Grid-hashed 2D DBSCAN as a native PyTorch extension (CPU + CUDA)."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [{name = "Ryan Peters", email = "ryanirl@icloud.com"}]
keywords = ["dbscan", "clustering", "pytorch", "cuda", "gpu"]
dependencies = [
    "torch>=2.0,<2.8",
    "numpy>=1.20",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest", "scikit-learn"]
bench = ["matplotlib", "scikit-learn"]

[project.urls]
Homepage = "https://github.com/ryanirl/dbscan-torch"
Repository = "https://github.com/ryanirl/dbscan-torch"
Issues = "https://github.com/ryanirl/dbscan-torch/issues"
Changelog = "https://github.com/ryanirl/dbscan-torch/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["dbscan_torch*"]

[tool.setuptools.package-data]
dbscan_torch = ["py.typed", "*.pyi"]
